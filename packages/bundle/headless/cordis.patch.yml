# The dsh-headless bundle patch: one-shot tasks and persistent TUI mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`dsh --profile headless "<task>"`), the `--session-id`/`--resume`,
# `--interactive`, `--json`, `--tui`, and `--plain` options, and this app's
# --help. The direct driver creates a fresh Agent, adopts the exact Session a
# flag names, or keeps one Agent alive for a persistent TUI prompt loop.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    # Keep the same temporary process-wide PTC mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # Reads its task and run options from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        interactive: !!js ctx.headlessStartup.interactive
        json: !!js ctx.headlessStartup.json
        tui: !!js ctx.headlessStartup.tui
        plain: !!js ctx.headlessStartup.plain

- id: hmr
  disabled: true
