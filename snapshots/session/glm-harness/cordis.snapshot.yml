# Replay only replaces providers; guidance and the default route come from the shipped overlay.
- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

# Keep this read-only guidance scenario independent of the host shell and ACL skill.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: sandbox
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: glm-harness
            name: GLM Harness
            models:
              - id: glm-snapshot
                inputModalities: [text]
                reasoningEfforts: [low, high, max]
