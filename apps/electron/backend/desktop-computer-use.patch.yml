# This overlay mounts the backend computer-use registration, policy service,
# and experimental native Cua Driver provider. The web-app bundle owns
# the computer sidebar and foreground toggle client modules. The Windows
# runtime deploys the native SDK and platform binary through the CLI closure.
#
# The provider has no configuration fields. It preserves the upstream tool
# schemas and publishes an element-index-to-token map from window snapshots.
# Native import or an occupied computer-use registration fails activation
# loudly and rolls back.
#
# To remove computer use from the desktop: delete this file, remove the
# `--patch` argument from backend/entry.mjs, and rebuild the installer.
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'

    - id: computer-use-policy
      name: '@deepseek-ai/dsh-computer-use-policy'

    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
