# The desktop build enables the experimental Agent Teams feature set: the
# durable roster/task-DAG host service, the model-facing team tools, and the
# browser conversation-header Team action. These three rows restate
# `packages/experimental/agent-team-profile/cordis.patch.yml` (the canonical
# home of the composition and its limits); restating rather than bundling is
# the desktop's ordinary layer mechanism, because a `--patch` overlay cannot
# add a bundle layer to the auto-initialized `web` profile.
#
# The profile bundle also disables the direct subagent delegation rows so
# coordination stays on the Team tools; the Web bundle patch already disables
# those same rows in the host plane, so this overlay needs no disable block.
#
# Rows land in the host plane, so every session on the desktop sees the team
# tools — matching the experimental bundle's process-wide composition. The
# packages themselves ship in the runtime closure already (apps/cli depends on
# the profile bundle); this overlay only mounts their rows.
#
# To turn Agent Teams off on the desktop: remove this file from the
# `--patch` chain in backend/entry.mjs and rebuild the installer.
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
        # 2026-10-22：由 false 恢复为 true。
        # 2026-10-21 临时关闭的原因：委派工具与 Team 都往同一个 Agent scope 注册
        # `list_subagent_models`，第二次注册抛 `tool "list_subagent_models" is already
        # registered in this scope`，顶层会话直接建不出来。
        # 现在改为「每个 scope 只注册一次、多个贡献者的策略取交集」
        # （packages/subagent/tool-subagent/src/list-models.ts），根因被修掉，
        # 不再靠关开关绕开，Team 成员仍可按需指定 provider/model。
        # 前提：打包产物里的 tool-subagent 运行时代码必须带这份修复；
        # scripts/check-offline-pack.mjs 的 runtime 检查会在产物与源码不同步时拦下。
        modelSelectionSettings: true

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
