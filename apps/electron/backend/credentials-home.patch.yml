# Ensure the desktop backend mounts the managed credentials provider over the
# shared default document (`~/.dsh/.credentials.yaml`), so a key entered in any
# dsh entry point — desktop onboarding, the Models page, or a dev CLI run —
# lands in the same store. The bundle layers already carry this row; the patch
# restates it so a future layer change cannot silently drop credentials from
# the desktop stack. Do not point this row at a private file: a separate path
# splits the store the onboarding writes from the one every other entry point
# reads, and the configured key stops carrying over.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
