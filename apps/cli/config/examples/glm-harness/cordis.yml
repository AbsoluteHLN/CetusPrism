# Opt-in headless composition. See docs/user/guide/glm-harness.md before selecting a gateway.
# ZCode-inspired behavior, implemented with native Harness plugins; no ZCode runtime.
- id: llm-pi-ai
  config:
    providers:
      glm-harness:
        displayName: GLM Harness
        api: openai-completions
        # Replace with the selected gateway's documented endpoint.
        baseURL: https://your-glm-gateway.invalid/v1
        apiKeyEnv: CETUS_GLM_API_KEY
        reasoning: high
        compat:
          thinkingFormat: openai
          supportsReasoningEffort: true
          supportsDeveloperRole: false
          requiresReasoningContentOnAssistantMessages: true
          maxTokensField: max_tokens
        models:
          - id: !!js process.env.CETUS_GLM_MODEL
            input: [text]
            contextWindow: !!js Number(process.env.CETUS_GLM_CONTEXT_WINDOW)
            maxTokens: !!js Number(process.env.CETUS_GLM_MAX_TOKENS)
            reasoningEfforts:
              low: low
              high: high
              max: max
        retryPolicy:
          mode: normal
          # Upstream ZCode spends a budget of 10 retries with exponential backoff
          # and jitter, and honors a provider wait hint over its own backoff.
          # This harness keeps that budget instead of the shorter local default
          # so a transient gateway failure does not end a long GLM task early.
          maxRetries: 10

- id: agent-default-model
  config:
    provider: glm-harness
    model: !!js process.env.CETUS_GLM_MODEL
    reasoningEffort: high

- id: compaction-basic
  name: "@deepseek-ai/dsh-compaction-basic"
  config:
    # Compact when the window is down to the model's own output reserve
    # plus an 8K summary headroom, instead of the flat 64K headroom.
    # With a 32K output reserve that starts compaction at ~159K tokens on
    # a 200K window (the flat reserve started it at ~102K) and at ~87K on
    # a 128K window (~30K). The 0.9 ratio is the ceiling for a window
    # whose output reserve is small.
    thresholdRatio: 0.9
    headroomTokens: 8192

- id: system-prompt
  config:
    personaPrefix: |-
      You are a coding agent. Inspect the relevant files and repository instructions before changing code.

      Keep edits focused on the requested outcome and follow the surrounding project's conventions.

      For multi-step work, track tasks with the available planning tools. Resume from recorded progress after context compaction.

      Use tool results, file contents, and test outcomes as completion evidence. A successful command does not by itself establish that the requested behavior works.

      Report completed work, failed checks, unverified requirements, and blockers separately. Do not claim tests ran when they did not.
    personaSuffix: Your working directory is {{cwd}}.
