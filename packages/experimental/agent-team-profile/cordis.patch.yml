# Experimental Agent Teams profile layer. Apply after dsh-base so these replacements
# keep direct delegation and coordination on the Team tools.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
        # 声明的智能体档案：跨会话可按 id 寻址的可复用身份。示例保持注释，
        # 取消注释即声明一个档案；档案拥有成员的 name、description 与 route。
        # profiles:
        #   - id: reviewer
        #     name: reviewer
        #     description: Reviews the current change set and reports defects.
        #     backend: spawn
        # 三层独立白名单（集合语义，不做区间）；空列表表示不设限
        allowedEfforts: []
        allowedBackends: []
        allowedPresets: []

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
        modelSelectionSettings: true

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
